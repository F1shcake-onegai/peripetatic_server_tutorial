site_name: Peripatetic Server Tutorial
# site_url: https://<user>.github.io/peripatetic_server_tutorial/
# repo_url: https://github.com/<user>/peripatetic_server_tutorial

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

hooks:
  - hooks/references.py

nav:
  - Home: index.md
  - Guide:
      - 0. Hardware Preparation: guide/00-hardware.md
      - 1. Set Up Raspberry Pi OS: guide/01-raspberry-pi-os.md
      - 2. Update and Upgrade: guide/02-update.md
      - 3. Configure zram: guide/03-zram.md
      - 4. Install Mesh Network Configurator: guide/04-mesh-vpn.md
      - 5. Create a Second Network Interface (Optional): guide/05-second-interface.md
